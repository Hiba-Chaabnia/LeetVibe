[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leetvibe"
version = "0.2.1"
description = "AI Pair Programming CLI for LeetCode — powered by Mistral AI"
readme = "PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Hiba Chaabnia", email = "hiba.chaabnia.pro@gmail.com" },
]
keywords = [
    "Data Structures and Algorithms",
    "LeetCode",
    "AI",
    "CLI",
    "Mistral",
    "Pair Programming",
    "Competitive Programming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Core CLI
    "textual>=0.89.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    # Code editor syntax highlighting (TextArea language="python")
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.23.0",
    # AI/ML
    "mistralai>=1.2.5",
    "elevenlabs>=1.11.0",
    # MCP
    "mcp>=1.0.0",
    # Audio playback
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    # Export
    "python-docx>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/Hiba-Chaabnia/LeetVibe"
Repository = "https://github.com/Hiba-Chaabnia/LeetVibe"
"Bug Tracker" = "https://github.com/Hiba-Chaabnia/LeetVibe/issues"
Changelog = "https://github.com/Hiba-Chaabnia/LeetVibe/blob/main/CHANGELOG.md"

[project.scripts]
leetvibe = "leetvibe.cli:main"

[tool.hatch.build.targets.wheel]
include = ["leetvibe/", "config.yaml"]

[tool.hatch.build.targets.wheel.force-include]
"leetvibe/data/problems" = "leetvibe/data/problems"

[tool.hatch.build.targets.sdist]
exclude = ["assets/*.gif"]

[tool.uv]
package = true
required-version = ">=0.6.0"
